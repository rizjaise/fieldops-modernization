name: FieldOps CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ./app/FieldOps.sln

      - name: Build
        run: dotnet build ./app/FieldOps.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ./app/FieldOps.sln --configuration Release --no-build